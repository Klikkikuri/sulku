[project]
name = "sulku"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Teemu Autto", email = "klikkikuri@teemu.rautakuu.org" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "fastapi>=0.139.2",
    "fasttext>=0.9.3",
    "huggingface-hub>=1.26.0",
    "jinja2>=3.1.6",
    "niitti[all]",
    "openai>=2.46.0",
    "opentelemetry-api>=1.44.0",
    # niitti's tracing provider exports over OTLP/HTTP; without this no spans leave the service.
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    # Instrumentors loaded by niitti's EXTRA_INSTRUMENTOR.
    "opentelemetry-instrumentation-click>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-jinja2>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    "opentelemetry-instrumentation-threading>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
    # Backs niitti's EXTRA_RESOURCE_DETECTOR container detector.
    "opentelemetry-resource-detector-containerid>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ratelimit>=2.2.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scikit-learn-intelex>=2026.1.0",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "trafilatura>=2.1.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
sulku = "sulku.cli:main"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"


[tool.uv.sources]
niitti = { workspace = true }


[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.15.22",
    "spacy>=3.8.14",
]
training = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselected by default)",
]

